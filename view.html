<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>جمعيتي | متابعة الدور</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#15182b;--muted:#778096;--primary:#6b55e8;--green:#12a36a;--line:#e7e9f1;--shadow:0 12px 32px rgba(28,32,62,.075)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#eeeaff,transparent 28%),var(--bg);font-family:"Cairo",Tahoma,Arial,sans-serif;color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:20px 14px 45px}.brand{text-align:center;margin:8px 0 18px}.brand .logo{margin:auto;width:54px;height:54px;border-radius:17px;background:linear-gradient(135deg,#d5a84b,#6b55e8);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800;box-shadow:0 10px 24px #6b55e833}.brand h1{font-size:24px;margin:9px 0 3px}.brand p{color:var(--muted);font-size:12px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:12px}.hero{background:linear-gradient(135deg,#15182e,#4a39b0 60%,#7869ed);color:#fff;border:0;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-90px;top:-90px;background:#ffffff12}.kicker{font-size:11px;opacity:.72}.name{font-size:28px;font-weight:900;margin:5px 0}.meta{font-size:12px;opacity:.82}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.stat{background:#ffffff12;border:1px solid #ffffff18;border-radius:14px;padding:11px}.stat b{display:block;font-size:19px}.stat span{font-size:10px;opacity:.72}.next{margin-top:12px;padding:11px;border-radius:14px;background:#ffffff12;font-size:12px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.box{background:#f8f8fc;border:1px solid var(--line);border-radius:15px;padding:13px;text-align:center}.box b{display:block;font-size:21px}.box span{font-size:10px;color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.section-title h2{font-size:16px;margin:0}.badge{font-size:10px;background:#f0efff;color:var(--primary);padding:6px 9px;border-radius:20px}.member{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.member:last-child{border-bottom:0}.num{width:34px;height:34px;border-radius:11px;background:#f0efff;color:var(--primary);display:grid;place-items:center;font-weight:800;flex:0 0 auto}.member.current{background:#faf9ff;margin:0 -8px;padding:11px 8px;border-radius:13px}.member.current .num{background:var(--primary);color:#fff}.member .info{min-width:0;flex:1}.member .mname{font-size:13px;font-weight:800}.member .sub{font-size:10px;color:var(--muted);margin-top:3px}.status{padding:5px 8px;border-radius:20px;font-size:9px;font-weight:800}.currentStatus{background:#eeeaff;color:#5a45d4}.done{background:#e8f8f1;color:#087a54}.waiting{background:#f2f3f6;color:#7a8292}.empty{text-align:center;padding:35px;color:var(--muted);font-size:13px}.error{background:#fff0f2;color:#bd3d50;border:1px solid #ffd4db}.loading{text-align:center;color:var(--muted);padding:35px}
@media(max-width:600px){.wrap{padding:12px 10px 35px}.card{border-radius:18px;padding:14px}.name{font-size:23px}.grid,.summary{grid-template-columns:1fr 1fr}.grid .stat:last-child{grid-column:1/-1}.member .status{font-size:8px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo">ج</div><h1 id="groupName">جمعيتي</h1><p>صفحة متابعة الدور — مشاهدة فقط</p></div>
  <div id="loading" class="card loading">جارٍ تحميل بيانات الجمعية...</div>
  <div id="app" style="display:none">
    <section class="card hero">
      <div class="kicker">الدور الحالي</div><div class="name" id="currentName">—</div><div class="meta" id="currentMeta">—</div>
      <div class="grid"><div class="stat"><b id="currentOrder">—</b><span>رقم الدور</span></div><div class="stat"><b id="totalMembers">—</b><span>عدد الأعضاء</span></div><div class="stat"><b id="doneCount">—</b><span>تم القبض</span></div></div>
      <div class="next" id="nextText">—</div>
    </section>
    <section class="card"><div class="section-title"><h2>ملخص الجمعية</h2><span class="badge">معلومات فقط</span></div><div class="summary"><div class="box"><b id="remainingCount">—</b><span>الأدوار المتبقية</span></div><div class="box"><b id="totalAmount">—</b><span>إجمالي قيمة الدور</span></div><div class="box"><b id="groupMonths">—</b><span>مدة الجمعية</span></div></div></section>
    <section class="card"><div class="section-title"><h2>ترتيب الأعضاء</h2><span class="badge">الدور 1 ← الأخير</span></div><div id="membersList"></div></section>
  </div>
  <div id="error" class="card error" style="display:none"></div>
</div>
<script src="firebase-config.js"></script>
<script>
/* Realtime Database path: jam3ety */
const FIREBASE_CONFIG = window.JAM3ETY_FIREBASE_CONFIG || null;
function money(n){return Number(n||0).toLocaleString('ar-EG')+' ج';}
function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function monthsBetween(a,b){if(!a||!b)return[];let out=[],d=new Date(a+'-01T00:00:00'),e=new Date(b+'-01T00:00:00');while(d<=e){out.push(d.toISOString().slice(0,7));d.setMonth(d.getMonth()+1)}return out}
function monthLabel(k){if(!k)return'';let [y,m]=k.split('-');return new Date(Number(y),Number(m)-1,1).toLocaleDateString('ar-EG',{month:'long',year:'numeric'});}
function initials(name){let p=String(name||'عضو').trim().split(/\s+/);return (p[0]?.[0]||'ع')+(p[1]?.[0]||'');}
function showError(msg){document.getElementById('loading').style.display='none';document.getElementById('error').style.display='block';document.getElementById('error').textContent=msg;}
function normalize(d){d=d||{};d.settings={name:'جمعيتي',months:12,startMonth:'',endMonth:'',...(d.settings||{})};d.members=Array.isArray(d.members)?d.members:[];d.payments=d.payments||{};d.receipts=d.receipts||{};d.members.sort((a,b)=>(Number(a.order)||999999)-(Number(b.order)||999999));d.members.forEach((m,i)=>m.order=i+1);return d;}
function render(data){data=normalize(data);document.getElementById('loading').style.display='none';document.getElementById('app').style.display='block';document.getElementById('groupName').textContent=data.settings.name||'جمعيتي';let members=data.members,total=members.length;let receiptIds=new Set(Object.values(data.receipts||{}).filter(Boolean));let doneIds=new Set();members.forEach(m=>{if(receiptIds.has(m.id))doneIds.add(m.id)});let doneCount=doneIds.size;let idx=members.findIndex(m=>!doneIds.has(m.id));if(idx<0)idx=total;let current=members[idx],next=members[idx+1];let totalAmount=members.reduce((s,m)=>s+Number(m.amount||0),0);document.getElementById('currentName').textContent=current?current.name:'تم إكمال الجمعية ✓';document.getElementById('currentMeta').textContent=current?`الدور رقم ${current.order} • ${data.settings.name}`:'تم الانتهاء من جميع الأدوار';document.getElementById('currentOrder').textContent=current?current.order:'✓';document.getElementById('totalMembers').textContent=total;document.getElementById('doneCount').textContent=doneCount;document.getElementById('remainingCount').textContent=Math.max(0,total-doneCount);document.getElementById('totalAmount').textContent=money(totalAmount);let months=monthsBetween(data.settings.startMonth,data.settings.endMonth);document.getElementById('groupMonths').textContent=months.length?months.length+' شهر':'—';document.getElementById('nextText').textContent=next?`🔜 الدور القادم: ${next.name} — رقم ${next.order}`:(current?'لا يوجد دور بعده':'تم الانتهاء من الجمعية بالكامل');document.getElementById('membersList').innerHTML=members.length?members.map((m,i)=>{let done=i<idx,isCurrent=i===idx;return `<div class="member ${isCurrent?'current':''}"><div class="num">${i+1}</div><div class="info"><div class="mname">${escapeHtml(m.name)}</div><div class="sub">${money(m.amount)} • ${isCurrent?'يقبض الآن':done?'تم الدور':'في الانتظار'}</div></div><span class="status ${isCurrent?'currentStatus':done?'done':'waiting'}">${isCurrent?'الدور الحالي':done?'تم القبض':'انتظار'}</span></div>`}).join(''):'<div class="empty">لا يوجد أعضاء مسجلون حتى الآن.</div>';}
(async()=>{try{if(!FIREBASE_CONFIG.apiKey||FIREBASE_CONFIG.apiKey.startsWith('PUT_'))return showError('لم يتم وضع بيانات Firebase بعد. افتح هذا الملف بعد إضافة Firebase Config الخاص بمشروعك.');let a=document.createElement('script');a.src='https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js';document.head.appendChild(a);await new Promise((r,j)=>{a.onload=r;a.onerror=j});let b=document.createElement('script');b.src='https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js';document.head.appendChild(b);await new Promise((r,j)=>{b.onload=r;b.onerror=j});firebase.initializeApp(FIREBASE_CONFIG);firebase.database().ref('jam3ety').on('value',s=>render(s.val()||{}),e=>showError('تعذر قراءة بيانات الجمعية: '+e.message));}catch(e){showError('تعذر تشغيل صفحة المتابعة. راجع إعدادات Firebase.');console.error(e)}})();
</script>
</body></html>
